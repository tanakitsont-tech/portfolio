<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tanakit Sonthe | Portfolio</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            line-height: 1.6;
        }

        header {
            background: linear-gradient(135deg, #1e3a8a, #0f172a);
            padding: 60px 20px;
            text-align: center;
        }

        .profile-img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #60a5fa;
            margin-bottom: 20px;
        }

        section {
            max-width: 1000px;
            margin: auto;
            padding: 50px 20px;
        }

        h3 {
            color: #60a5fa;
            border-bottom: 2px solid #1e40af;
            padding-bottom: 5px;
        }

        .card {
            background: #020617;
            border-left: 5px solid #2563eb;
            padding: 20px;
            margin-top: 20px;
            border-radius: 6px;
        }

        .project-img {
            width: 100%;
            margin-top: 15px;
            border-radius: 6px;
        }

        footer {
            background: #020617;
            text-align: center;
            padding: 20px;
            font-size: 14px;
            color: #9ca3af;
        }
    </style>
</head>

<body>

<header>
    <img src="images/profile.jpg" alt="Profile" class="profile-img">
    <h1>TANAKIT SONTHE</h1>
    <h2>Computer & Robotics Engineering Student</h2>
</header>

<section>
    <h3>Project Experience</h3>

    <!-- WIFI -->
    <div class="card">
        <h4>WiFi Heat Map Project</h4>
        <img src="images/wifi1.png" class="project-img">
        <img src="images/wifi2.png" class="project-img">
        <img src="images/wifi3.png" class="project-img">
        <img src="images/wifi4.png" class="project-img">
        <img src="images/wifi15.png" class="project-img">
    </div>

    <!-- ROS -->
    <div class="card">
        <h4>ROS2 Project</h4>
        <img src="images/ros1.png" class="project-img">
        <img src="images/ros2.png" class="project-img">
        <img src="images/ros3.png" class="project-img">
        <img src="images/ros4.png" class="project-img">
        <img src="images/ros5.png" class="project-img">
        <img src="images/ros6.png" class="project-img">
        <img src="images/ros7.png" class="project-img">
        <img src="images/ros8.png" class="project-img">
    </div>

    <!-- PHOTO BOOTH -->
    <div class="card">
        <h4>Robotic Photo Booth</h4>
        <img src="images/photobooth1.jpg" class="project-img">
        <img src="images/photobooth2.jpg" class="project-img">
    </div>

</section>

<footer>
    © 2026 Tanakit Sonthe | Portfolio
</footer>

</body>
</html>
